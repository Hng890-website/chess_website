<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GM CHESS OS - PREMIUM EDITION</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="wallpaper-glow"></div>

    <div id="cmos-modal" class="modal-overlay">
        <div class="modal-box glass">
            <div class="modal-header">
                <span class="modal-title"><i class="fas fa-microchip"></i> CMOS problem</span>
                <button class="modal-close" onclick="closeCmosModal()">&times;</button>
            </div>
            <div class="modal-body">
                <p>Your CMOS battery is dead, please contact support to fix it.</p>
            </div>
            <div class="modal-footer">
                <button class="btn-primary" onclick="closeCmosModal()">Confirm</button>
            </div>
        </div>
    </div>

    <div class="os-wrapper glass">
        <aside class="sidebar">
            <div class="brand">
                <div class="logo-box"><i class="fas fa-chess-knight"></i></div>
                <span>GM<b>CHESS</b></span>
            </div>
            <nav class="menu">
                <button class="menu-item active"><i class="fas fa-play"></i> Play</button>
                <button class="menu-item"><i class="fas fa-puzzle-piece"></i> Puzzle</button>
                <button class="menu-item"><i class="fas fa-microchip"></i> Analysis</button>
            </nav>
            <div class="sidebar-footer">
                <button class="btn-icon-text"><i class="fas fa-cog"></i> Settings</button>
                <div class="build-info">Build 2026.02.28</div>
            </div>
        </aside>

        <main class="content">
            <header class="top-bar">
                <h2>Dashboard</h2>
                <div class="user-pill glass">
                    <div class="avatar">G</div>
                    <span>Guest User</span>
                </div>
            </header>

            <div class="grid-container">
                <div class="tile-card glass interact" onclick="enterGame('ai')">
                    <div class="tile-glow"></div>
                    <div class="tile-icon-bg"><i class="fas fa-robot"></i></div>
                    <div class="tile-text">
                        <h3>Stockfish 18</h3>
                        <p>Challenge the world's strongest AI</p>
                    </div>
                    <div class="tile-arrow"><i class="fas fa-chevron-right"></i></div>
                </div>

                <div class="tile-card glass status-tile">
                    <div class="status-header">SYSTEM STATUS</div>
                    <div class="clock-display">
                        <span id="os-time">--:--</span>
                        <small id="os-date">--.--.----</small>
                    </div>
                    <div class="status-footer">
                        <div class="indicator">
                            <span class="dot" id="cmos-dot"></span>
                            CMOS: <b id="cmos-status">Checking...</b>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="game-area" style="display:none;">
        <div class="game-layout">
            <div id="myBoard"></div>
            <div class="game-controls glass">
                <div id="move-history"></div>
                <button class="btn-danger" onclick="backToMenu()">QUIT GAME</button>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
