<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GM CHESS - ULTIMATE</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="main-header">
    <div class="logo">GM<span>CHESS</span></div>
    <div class="header-tools">
        <span id="status">● Mode: AI</span>
        <button class="btn-sm" onclick="openOnlineModal()">Multiplayer</button>
    </div>
</header>

<div class="game-layout">
    <div class="board-container">
        <div id="myBoard"></div>
    </div>
    
    <div class="side-panel">
        <div class="move-history-card">
            <div class="card-header">HISTORY</div>
            <div id="move-history"></div>
        </div>
        <button id="resetBtn" class="btn-primary">NEW GAME</button>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="script.js"></script>
</body>
</html>
