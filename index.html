<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grandmaster Chess AI</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="header-content">
            <div class="logo"><i class="fas fa-chess-knight"></i> GM CHESS</div>
            <nav>
                <div class="lang-container">
                    <i class="fas fa-globe"></i>
                    <select id="lang-select-header" class="lang-switch">
                        <option value="vi">Tiếng Việt</option>
                        <option value="en">English</option>
                        <option value="fr">Français</option>
                        <option value="jp">日本語</option>
                    </select>
                </div>
            </nav>
        </div>
    </header>

    <main>
        <div class="game-container">
            <div class="player-section engine-side">
                <div class="avatar-wrapper">
                    <img src="https://lichess1.org/assets/_6S08W2/images/v3/robot.svg" alt="Bot">
                </div>
                <div class="player-details">
                    <span class="player-name" data-i18n="bot_name">Stockfish AI <small>Level 10</small></span>
                    <span id="engine-status" class="game-hint" data-i18n="engine_ready">Máy đã sẵn sàng!</span>
                </div>
            </div>

            <div id="myBoard" class="styled-board"></div>

            <div class="player-section user-side">
                <div class="avatar-wrapper">
                    <img src="https://lichess1.org/assets/_6S08W2/images/v3/avatar/blank.svg" alt="User">
                </div>
                <div class="player-details">
                    <span class="player-name" data-i18n="user_name">Người chơi (Trắng)</span>
                    <span id="user-status" class="game-hint" data-i18n="user_turn">Tới lượt bạn đi</span>
                </div>
            </div>

            <div class="action-bar">
                <button id="resetBtn" class="btn-primary">
                    <i class="fas fa-undo"></i> <span data-i18n="new_game">Ván mới</span>
                </button>
            </div>
        </div>
    </main>

    <footer>
        <div class="footer-content">
            <p id="footer-text" data-i18n="footer">&copy; 2026 Powered by Stockfish Engine | Developed by HNG890</p>
            <div class="footer-bottom">
                <select id="lang-select-footer" class="lang-switch">
                    <option value="vi">Tiếng Việt</option>
                    <option value="en">English</option>
                    <option value="fr">Français</option>
                    <option value="jp">日本語</option>
                </select>
                <div class="social-links">
                    <i class="fab fa-github"></i>
                    <i class="fab fa-discord"></i>
                </div>
            </div>
        </div>
    </footer>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
