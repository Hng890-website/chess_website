<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>GM CHESS OS - PREMIUM</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-blur"></div>

    <div class="os-shell glass">
        <aside class="sidebar">
            <div class="brand"><i class="fas fa-chess-queen"></i> GM CHESS</div>
            <nav class="nav-menu">
                <button class="nav-link active"><i class="fas fa-th-large"></i> Dashboard</button>
                <button class="nav-link" onclick="enterGame()"><i class="fas fa-play"></i> Play AI</button>
                <button class="nav-link"><i class="fas fa-cog"></i> Settings</button>
            </nav>
            <div class="os-footer">Build 2026.03.01</div>
        </aside>

        <main class="dashboard">
            <h1>Dashboard</h1>
            <div class="grid">
                <div class="tile interact" onclick="enterGame()">
                    <div class="tile-icon"><i class="fas fa-robot"></i></div>
                    <h3>Stockfish 16.1</h3>
                    <p>Đấu với AI mạnh nhất thế giới</p>
                </div>

                <div class="tile clock-tile">
                    <span class="status-label">SYSTEM STATUS</span>
                    <div id="os-time">00:00</div>
                    <div id="os-date">01.01.2000</div>
                    <div class="cmos-info">
                        <span class="dot" id="cmos-dot"></span>
                        CMOS: <b id="cmos-status">Checking...</b>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="game-screen" class="hidden">
        <div class="game-container glass">
            <div id="myBoard"></div>
            <div class="game-sidebar">
                <div id="move-history"></div>
                <button class="btn-quit" onclick="location.reload()">QUIT GAME</button>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
