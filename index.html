<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GM Chess - Ultimate Edition</title>
    <link rel="icon" href="https://lichess1.org/assets/images/favicon-32.png" type="image/png">
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="home-screen">
        <div class="home-content">
            <div class="home-logo"><i class="fas fa-chess-knight"></i> GM CHESS</div>
            <div class="home-menu">
                <button class="btn-menu btn-play" onclick="startGame()"><i class="fas fa-play"></i> Chơi với Máy</button>
                <button class="btn-menu btn-auth" onclick="openLogin()"><i class="fas fa-user"></i> Đăng nhập</button>
            </div>
        </div>
    </div>

    <div id="loginModal" class="modal">
        <div class="modal-content">
            <h2>Đăng nhập</h2>
            <input type="text" id="username" placeholder="Tên của bạn...">
            <button class="btn-pri" style="width: 100%" onclick="handleLogin()">Vào ván đấu</button>
        </div>
    </div>

    <header>
        <div class="header-content">
            <div class="logo">GM CHESS</div>
            <div class="nav-right" id="nav-auth-zone">
                <button class="nav-btn premium">Free Analysis</button>
                <button class="nav-btn" onclick="openLogin()">Login</button>
            </div>
        </div>
    </header>

    <main class="main-layout">
        <div class="game-area">
            <div id="myBoard" class="styled-board"></div>
            <div class="player-info">
                <img src="https://lichess1.org/assets/_6S08W2/images/v3/avatar/blank.svg" width="30">
                <span id="display-name">Người chơi</span> (Trắng)
            </div>
        </div>

        <div class="side-panel">
            <div class="history-container">
                <div class="history-header">LỊCH SỬ NƯỚC ĐI</div>
                <div id="move-history" class="history-list"></div>
                <div class="history-nav">
                    <button id="prevBtn"><i class="fas fa-chevron-left"></i></button>
                    <button id="nextBtn" disabled><i class="fas fa-chevron-right"></i></button>
                </div>
            </div>
            <button id="hintBtn" class="btn-sec"><i class="fas fa-lightbulb"></i> Gợi ý nước đi</button>
            <button id="resetBtn" class="btn-pri"><i class="fas fa-undo"></i> Ván mới</button>
        </div>
    </main>

    <audio id="snd-move" preload="auto" src="https://lichess1.org/assets/sound/standard/Move.ogg"></audio>
    <audio id="snd-capture" preload="auto" src="https://lichess1.org/assets/sound/standard/Capture.ogg"></audio>
    <audio id="snd-check" preload="auto" src="https://lichess1.org/assets/sound/standard/Check.ogg"></audio>
    <audio id="snd-start" preload="auto" src="https://lichess1.org/assets/sound/standard/GenericNotify.ogg"></audio>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
