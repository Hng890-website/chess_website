<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Chess Pro - Fixed Layout</title>
    <link rel="icon" href="https://lichess1.org/assets/images/favicon-32.png">
    
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="main-wrapper">
        <div class="board-container">
            <div id="myBoard"></div>
        </div>

        <div class="side-panel">
            <h3>Lịch sử nước đi</h3>
            <div id="move-history" class="history-box"></div>
            <button id="resetBtn">Ván mới</button>
        </div>
    </div>

    <audio id="snd-move" src="https://lichess1.org/assets/sound/standard/Move.ogg"></audio>
    <audio id="snd-capture" src="https://lichess1.org/assets/sound/standard/Capture.ogg"></audio>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
