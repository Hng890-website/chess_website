<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GM CHESS OS - FINAL</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-glow"></div>

    <div id="cmos-modal" class="modal-overlay" style="display: none;">
        <div class="modal-box">
            <div class="modal-header">
                <span class="modal-title">⚠️ CMOS problem</span>
                <button class="modal-close" onclick="closeCmosModal()">&times;</button>
            </div>
            <div class="modal-body">
                Your CMOS battery is dead, please contact support to fix it.
            </div>
            <div class="modal-footer">
                <button class="btn-modal-ok" onclick="closeCmosModal()">OK</button>
            </div>
        </div>
    </div>

    <div id="main-menu" class="os-container">
        <aside class="os-sidebar">
            <div class="os-logo"><div class="logo-icon">♞</div><span>GM</span>CHESS</div>
            <nav class="os-nav">
                <button class="nav-item active" onclick="enterGame('ai')">Play</button>
                <button class="nav-item">Puzzle</button>
                <button class="nav-item">Analysis</button>
            </nav>
            <div class="os-sidebar-footer">
                <button class="nav-item-sm" onclick="toggleLang()">Language</button>
                <div class="version">Build 2026.02</div>
            </div>
        </aside>

        <main class="os-content">
            <header class="content-header">
                <h1>Dashboard</h1>
                <div class="user-profile"><div class="avatar">G</div></div>
            </header>

            <div class="tiles-grid">
                <div class="tile-card glass-effect" onclick="enterGame('ai')">
                    <div class="tile-badge">AI</div>
                    <div class="tile-icon">🤖</div>
                    <span class="tile-label">Play with Stockfish</span>
                </div>

                <div class="tile-card glass-effect widget-tile">
                    <div class="widget-header">SYSTEM STATUS</div>
                    <div class="big-time" id="os-time">00:00</div>
                    <div class="sub-date" id="os-date">01.01.2000</div>
                    <div class="widget-footer">
                        <div class="status-dot" id="cmos-dot"></div>
                        CMOS Battery: <span id="cmos-status">Checking...</span>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="game-area" style="display:none;">
        <div class="game-wrapper">
            <div id="myBoard"></div>
            <div class="sidebar-game">
                <div id="move-history"></div>
                <button class="btn-exit" onclick="backToMenu()">QUIT</button>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
