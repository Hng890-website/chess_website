<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Chess vs Stockfish</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
</head>
<body>

    <div class="game-container">
        <div class="player-info top">
            <img src="https://lichess1.org/assets/_6S08W2/images/v3/robot.svg" alt="bot-icon" class="avatar">
            <div class="details">
                <strong>Stockfish (Máy)</strong>
                <span id="engine-status">Đang chờ...</span>
            </div>
        </div>

        <div id="myBoard"></div>

        <div class="player-info bottom">
            <img src="https://lichess1.org/assets/_6S08W2/images/v3/avatar/blank.svg" alt="user-icon" class="avatar">
            <div class="details">
                <strong>Bạn (Người chơi)</strong>
                <span id="user-status">Đến lượt bạn</span>
            </div>
        </div>

        <div class="controls">
            <button id="resetBtn">Chơi ván mới</button>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
