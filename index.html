<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GM Chess Elite - Fixed Version</title>
    
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #81b64c;
            --dark-bg: #161512;
            --glass: rgba(255, 255, 255, 0.05);
            --text-main: #f1f1f1;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* --- FIX LỖI GIAO DIỆN TRÀN (CỰC KỲ QUAN TRỌNG) --- */
        .app-container {
            width: 100%;
            max-width: 1000px;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .game-layout {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 20px;
        }

        @media (max-width: 800px) {
            .game-layout { grid-template-columns: 1fr; }
        }

        /* --- FIX LỖI QUÂN CỜ KHỔNG LỒ --- */
        #myBoard {
            width: 100% !important;
            max-width: 550px;
            margin: 0 auto;
            border: 5px solid #262421;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* Đảm bảo ảnh quân cờ nằm gọn trong ô */
        .chessboard-63f59 img {
            width: 100% !important;
            height: 100% !important;
        }

        /* --- STYLE CÁC THÀNH PHẦN KHÁC --- */
        .glass-card {
            background: var(--glass);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            padding: 15px;
        }

        .move-history {
            height: 350px;
            overflow-y: auto;
            display: grid;
            grid-template-columns: 40px 1fr 1fr;
            font-size: 0.9rem;
            background: rgba(0,0,0,0.2);
            padding: 10px;
        }

        .btn {
            padding: 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
            width: 100%;
            margin-top: 10px;
        }

        .btn-play { background: var(--primary); color: white; }
        .btn-play:hover { background: #a3d16a; }

        .suggest-dot {
            width: 20%; height: 20%; background: rgba(0,0,0,0.2);
            border-radius: 50%; position: absolute; top: 40%; left: 40%;
        }

        .highlight-selected { background-color: rgba(129, 182, 76, 0.5) !important; }

        #home-screen {
            position: fixed; inset: 0; background: rgba(0,0,0,0.9);
            z-index: 999; display: flex; align-items: center; justify-content: center;
        }
    </style>
</head>
<body>

    <div id="home-screen">
        <div class="glass-card" style="width: 300px; text-align: center;">
            <h1 style="color: var(--primary);">GM CHESS</h1>
            <button class="btn btn-play" onclick="startGame()">BẮT ĐẦU CHƠI</button>
        </div>
    </div>

    <div class="app-container">
        <header style="text-align: center;">
            <h2>Bàn cờ của bạn</h2>
        </header>

        <div class="game-layout">
            <div class="board-container">
                <div id="myBoard"></div>
            </div>

            <aside class="controls">
                <div class="glass-card">
                    <div style="text-align:center; margin-bottom:10px; font-weight:bold;">LỊCH SỬ</div>
                    <div id="move-history" class="move-history"></div>
                </div>
                <button class="btn btn-play" onclick="location.reload()">VÁN MỚI</button>
            </aside>
        </div>
    </div>

    <audio id="snd-move" src="https://lichess1.org/assets/sound/standard/Move.ogg"></audio>
    <audio id="snd-capture" src="https://lichess1.org/assets/sound/standard/Capture.ogg"></audio>
    <audio id="snd-check" src="https://lichess1.org/assets/sound/standard/Check.ogg"></audio>
    <audio id="snd-start" src="https://lichess1.org/assets/sound/standard/GenericNotify.ogg"></audio>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

    <script>
        var board = null;
        var game = new Chess();
        var selectedSquare = null;

        const snd = {
            move: document.getElementById('snd-move'),
            capture: document.getElementById('snd-capture'),
            check: document.getElementById('snd-check'),
            start: document.getElementById('snd-start')
        };

        function play(id) {
            if (snd[id]) {
                snd[id].currentTime = 0;
                snd[id].play().catch(() => {});
            }
        }

        function startGame() {
            $('#home-screen').hide();
            play('start');
        }

        function onMove(m) {
            let res = game.move(m, { sloppy: true });
            if (!res) return false;

            if (game.in_check()) play('check');
            else if (res.flags.includes('c')) play('capture');
            else play('move');

            board.position(game.fen());
            updateHistory();
            $('.square-55d63').removeClass('highlight-selected');
            $('.suggest-dot').remove();

            // AI đi ngẫu nhiên
            if (game.turn() === 'b' && !game.game_over()) {
                setTimeout(() => {
                    let moves = game.moves();
                    onMove(moves[Math.floor(Math.random() * moves.length)]);
                }, 500);
            }
            return true;
        }

        function updateHistory() {
            let h = game.history();
            let html = '';
            for (let i = 0; i < h.length; i += 2) {
                html += `<div style="color:#666">${Math.floor(i/2)+1}</div>`;
                html += `<div>${h[i]}</div>`;
                html += `<div>${h[i+1] || ''}</div>`;
            }
            $('#move-history').html(html).scrollTop(9999);
        }

        // FIX CLICK-TO-MOVE
        $('#myBoard').on('mousedown', '.square-55d63', function() {
            let sq = $(this).data('square');
            if (selectedSquare) {
                if (onMove({ from: selectedSquare, to: sq, promotion: 'q' })) {
                    selectedSquare = null;
                    return;
                }
            }
            $('.square-55d63').removeClass('highlight-selected');
            $('.suggest-dot').remove();
            let p = game.get(sq);
            if (p && p.color === 'w') {
                selectedSquare = sq;
                $(this).addClass('highlight-selected');
                game.moves({ square: sq, verbose: true }).forEach(m => {
                    $(`.square-${m.to}`).append('<div class="suggest-dot"></div>');
                });
            } else { selectedSquare = null; }
        });

        $(window).on('load', function() {
            board = Chessboard('myBoard', {
                draggable: true,
                position: 'start',
                pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
            });
            $(window).resize(board.resize);
        });
    </script>
</body>
</html>
