<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess with Stockfish</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Chess with Stockfish</h1>
        <div id="board" style="width: 400px"></div>
        <div class="controls">
            <button id="startButton">Start Game</button>
            <button id="resetButton">Reset Board</button>
            <p>Status: <span id="status">Ready</span></p>
            <p>FEN: <span id="fen">rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1</span></p>
            <p>Engine Thinking: <span id="engineThinking"></span></p>
        </div>
    </div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">

    <script src="https://unpkg.com/chess.js@0.10.3/chess.js"></script>

    <script src="./stockfish.js"></script> <script src="script.js"></script>
</body>
</html>
