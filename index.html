<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GM CHESS OS - FINAL FIX</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark-mode">
    <div class="os-wrapper">
        <aside class="sidebar glass">
            <div class="brand">GM CHESS</div>
            <nav class="nav-menu">
                <button class="nav-btn active"><i class="fas fa-home"></i> Dashboard</button>
                <button class="nav-btn" onclick="enterGame()"><i class="fas fa-play"></i> Play AI</button>
                <button class="nav-btn" onclick="toggleTheme()"><i class="fas fa-circle-half-stroke"></i> Theme</button>
            </nav>
        </aside>

        <main class="main-content">
            <h1 class="page-title">Dashboard</h1>
            <div class="widgets-container">
                <div class="widget-card interact glass" onclick="enterGame()">
                    <div class="icon-box"><i class="fas fa-robot"></i></div>
                    <h3>Stockfish 16.1</h3>
                    <p>Challenge the world's strongest AI</p>
                </div>

                <div class="widget-card clock-box glass-dark">
                    <div id="os-time">00:00:00</div>
                    <div id="os-date">Loading date...</div>
                    <div class="status-line">
                        <span id="cmos-dot"></span>
                        CMOS: <span id="cmos-status">Checking...</span>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="game-screen" class="full-overlay" style="display:none;">
        <div class="game-layout glass">
            <div id="myBoard"></div>
            
            <div class="game-sidebar">
                <h3>Move History</h3>
                <div id="move-history"></div>
                <button class="btn-exit" onclick="location.reload()">EXIT GAME</button>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
