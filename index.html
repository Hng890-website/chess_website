<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess vs Stockfish</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">
        <div class="player-card">
            <img src="https://lichess1.org/assets/_6S08W2/images/v3/robot.svg" class="avatar">
            <div class="info">
                <div class="name">Stockfish (Máy)</div>
                <div id="engine-status" class="status">Đang chờ ván đấu...</div>
            </div>
        </div>

        <div id="myBoard"></div>

        <div class="player-card">
            <img src="https://lichess1.org/assets/_6S08W2/images/v3/avatar/blank.svg" class="avatar">
            <div class="info">
                <div class="name">Bạn (?)</div>
                <div id="user-status" class="status">Đến lượt bạn đi</div>
            </div>
        </div>

        <button id="resetBtn">Ván mới</button>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
